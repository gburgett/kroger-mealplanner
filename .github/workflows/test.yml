name: test

# The scenarios under features/ and the unit tests, in the test BEAM (ADR 0022).
# There is one mode: the meal plan is documents in the state database and the
# assistant gets file verbs, not a shell (ADR 0038, ADR 0039), so there is no
# sandbox to build, no KVM to need, and no @security scenario to exclude — each
# asserts an authorisation boundary, which nothing on a runner weakens.
#
# The database is one SQLite file `ecto.create` makes, so this job needs no
# service. The third parties (Kroger, Walmart, the exe.dev LLM gateway, the
# SuperTokens core and the SMS provider) are real listeners on 127.0.0.1, so
# nothing in this job can reach a real one — and nothing in it can send a real
# text message.
#
# This workflow was disabled on 2026-09-06, when the host-mode suite left
# hundreds of shell process trees behind and the hosted runner lost contact.
# The shell went with the sandbox (ADR 0039); the suite now spawns only the
# `mealplan` parser, removes its scratch directory on every path out, and runs
# in about 18 seconds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MIX_ENV: test
  ELIXIR_ERL_OPTIONS: "+fnu"
  LANG: C.UTF-8

jobs:
  test:
    name: scenarios and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          # Matches the VM (OTP 28.5, Elixir 1.19.6-otp-28).
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # Every agent write to a recipe or a day is checked by the `mealplan`
      # parser before it is stored, so the binary has to exist.
      - uses: actions/cache@v4
        with:
          path: cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/Cargo.lock') }}

      - name: Build the mealplan CLI
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path cli/Cargo.toml

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
