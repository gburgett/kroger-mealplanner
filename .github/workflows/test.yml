name: test

# The scenarios under features/ run in host mode here, on purpose: an
# ubuntu-latest runner has no /dev/kvm, so the microsandbox default (ADR 0032)
# cannot run, and building a bubblewrap image needs Docker plus unprivileged
# user namespaces. Host mode is the no-KVM fallback, not the default — see
# ADR 0022 and ADR 0032. The database is one SQLite file
# (ADR 0024, restored by ADR 0030), so this job needs no service — ADR 0028's
# PostgreSQL was only there for a self-hosted SuperTokens core, and ADR 0029
# moved that core off the machine.
#
# The tool scenarios run in the test BEAM against the handlers. The ones about
# the screens and the transport go over a real socket to an endpoint this same
# BEAM is running, so the session gate, the sign-in screens, the OAuth handshake
# and anubis_mcp's Streamable HTTP transport are all under test here too —
# ADR 0023. The third parties (Kroger, Walmart, the exe.dev LLM gateway, and now
# the SuperTokens core and the SMS provider) are real listeners on 127.0.0.1, so
# nothing in this job can reach a real one — and nothing in it can send a real
# text message.
#
# What this job does NOT prove is containment. Every @security scenario is
# excluded in host mode, and mix test says so in a banner rather than reporting
# a quiet green. Those scenarios need bubblewrap and a built image — the
# `sandboxed` job below, which is where a release gets its evidence.
#
# (That exclusion is wider than it needs to be: 22 of the 23 @security scenarios
# in the ported files pass under host mode, because most are about the
# authorisation boundary rather than containment. Narrowing it needs a second
# tag and a decision about what @security promises — see ADR 0023.)

on:
  push:
    branches: [main, elixir-migration]
  pull_request:

env:
  MIX_ENV: test
  ELIXIR_ERL_OPTIONS: "+fnu"
  LANG: C.UTF-8

jobs:
  logic:
    name: application logic (host mode)
    runs-on: ubuntu-latest

    # No service container. The state is a SQLite file `ecto.create` makes, and
    # the SuperTokens core and the SMS provider are third-party HTTP APIs —
    # `Mealplan.Mock.SuperTokens` stands in for both on a port the operating
    # system picks.

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          # Matches the VM (plan 0005: OTP 28.5.0.6, Elixir 1.19.6-otp-28), so
          # CI and the machine that serves the household agree.
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # The corpus reaches for `mealplan` on PATH. Under bubblewrap it is staged
      # into the image; in host mode it has to be a real binary on the runner,
      # so it is built here and found through MEALPLAN_CLI_PATH.
      - uses: actions/cache@v4
        with:
          path: cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/Cargo.lock') }}

      - name: Build the mealplan CLI
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path cli/Cargo.toml

      - run: mix deps.get
      - run: mix compile --warnings-as-errors

      # `mix format --check-formatted` is deliberately not here yet. The
      # formatter's output moves between Elixir versions, and this branch was
      # written on 1.18 while the VM runs 1.19 — a check added blind would fail
      # on files nobody in this change touched. Add it in a commit that runs
      # `mix format` on 1.19 first.

      # Host mode is explicit here because ubuntu-latest has no /dev/kvm;
      # `mix test` with no MEALPLAN_SANDBOX would pick microsandbox (ADR 0032)
      # and preflight would raise.
      - name: Run the scenarios
        env:
          MEALPLAN_SANDBOX: host
          MEALPLAN_CLI_PATH: cli/target/x86_64-unknown-linux-musl/release
        run: mix test

  # Not wired to run yet: it needs a runner that can build the sandbox image
  # (Docker) and use unprivileged user namespaces for bwrap. Until it does, the
  # @security scenarios are run by a person on the VM before a release, per
  # AGENTS.md — "those scenarios are not optional and not 'later'".
  #
  #  sandboxed:
  #    name: containment (@security, bubblewrap)
  #    runs-on: ubuntu-latest
  #    steps:
  #      - run: ./sandbox-image/build.sh && ./cli/build.sh
  #      - run: mix test --only security
