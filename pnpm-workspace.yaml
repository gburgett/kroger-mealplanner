# Supply-chain hardening for the MCP server's dependencies. See ADR 0004.
#
# These matter more than they look: the server's dependencies run OUTSIDE the
# sandbox, in the process that holds every tenant's credentials. The sandbox
# contains the agent. It does not contain npm.

# A dependency may not run a build script. Add a package here only after you
# have looked at what its script does:
#   allowBuilds:
#     some-package: true
allowBuilds: {}

# Do not resolve a version published less than 7 days ago. Compromised releases
# are typically pulled within hours. pnpm 11 defaults to 1440 (1 day); this is
# stricter. To take a genuine fix immediately, set this to 0, install, restore.
minimumReleaseAge: 10080

# pnpm 11 defaults. Stated explicitly so a future default change is visible.
blockExoticSubdeps: true
strictDepBuilds: true
