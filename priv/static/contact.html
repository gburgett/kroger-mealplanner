<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact &mdash; Plantrify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #faf7f0;
      --paper-alt: #f4efe4;
      --ink: #241f19;
      --ink-soft: #4a4238;
      --label: #6f6252;
      --border: #e3dbcc;
      --green: #2f6b45;
      --green-dark: #26593a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 300 16px/1.6 'Newsreader', Georgia, serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 0 1.25rem 3rem; }
    a { color: inherit; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 2rem; margin: 0 0 .75rem; }
    p { color: var(--ink-soft); }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 32rem;
      margin: 0 auto;
      padding: 22px 1.25rem 2.5rem;
    }
    .nav .brand { font: 400 20px/1 'Instrument Serif', Georgia, serif; text-decoration: none; color: var(--ink); }

    label { display: block; margin-top: 1.1rem; font: 500 13px/1 system-ui, sans-serif; letter-spacing: .01em; color: var(--ink); }
    input, textarea {
      width: 100%;
      margin-top: .4rem;
      padding: .65rem .7rem;
      font: 300 15px/1.5 'Newsreader', Georgia, serif;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 3px;
      box-sizing: border-box;
      color: var(--ink);
    }
    input:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      width: 100%;
      margin-top: 1.5rem;
      background: var(--green);
      color: #f7fbf8;
      border: none;
      border-radius: 3px;
      font: 500 16.5px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .btn:hover { background: var(--green-dark); }
    .hp { position: absolute; left: -9999px; }

    footer {
      max-width: 32rem;
      margin: 3rem auto 0;
      padding: 1.25rem 1.25rem 2rem;
      border-top: 1px solid var(--border);
      font: 400 11px/1.6 'Space Mono', monospace;
      color: var(--label);
    }
    footer a { text-decoration: none; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="brand">plantrify</a>
  </nav>

  <main>
    <h1>Ask for an invitation</h1>

    <p>
      Questions about the service, these documents, or a privacy request &mdash;
      send them here. Messages go to the operator by email.
    </p>

    <!--
      This form posts directly from the visitor's browser to Web3Forms; the
      server is not involved. Replace the access_key value below with the key
      from https://web3forms.com (Create Access Key). The key is meant to be
      public and can safely live in this file.
    -->
    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="REPLACE_WITH_WEB3FORMS_ACCESS_KEY">
      <input type="hidden" name="subject" value="New Plantrify contact message">
      <input type="hidden" name="from_name" value="Plantrify contact form">

      <!-- honeypot: bots fill this, people never see it -->
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="btn">Send</button>
    </form>
  </main>

  <footer>
    <p>
      <a href="/">Home</a> &middot;
      <a href="/terms.html">Terms of Service</a> &middot;
      <a href="/privacy.html">Privacy Policy</a>
    </p>
  </footer>
</body>
</html>
